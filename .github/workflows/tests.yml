name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }} / ${{ matrix.deps }} deps
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python: "3.10", deps: minimum}
          - {os: ubuntu-latest, python: "3.13", deps: latest}
          - {os: macos-latest, python: "3.13", deps: latest}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install minimum supported dependency versions
        if: matrix.deps == 'minimum'
        run: >
          python -m pip install
          "numpy==1.22.4" "scipy==1.7.3" "matplotlib==3.5.3" "powerlaw==1.5"
      - name: Install edgeofpy with test dependencies
        run: python -m pip install -e ".[test]"
      - name: Run tests
        run: python -m pytest -v

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install ruff
      - run: ruff check .

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[docs]"
      - name: Build the docs (warnings are errors)
        run: python -m sphinx -W --keep-going -b html docs docs/_build/html
