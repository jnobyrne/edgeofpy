[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"

[project]
name = "edgeofpy"
version = "0.1.0.dev0"
description = "Tools for brain criticality estimation, especially for M/EEG"
readme = "README.rst"
license = "Apache-2.0"
authors = [{ name = "Jordan O'Byrne", email = "jordan.obyrne@gmail.com" }]
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.22",
    "scipy>=1.7",
    "matplotlib>=3.5",
    "powerlaw>=1.5",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

[project.urls]
Repository = "https://github.com/jnobyrne/edgeofpy"
