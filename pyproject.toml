[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"

[project]
name = "edgeofpy"
version = "0.1.0"
description = "Tools for brain criticality estimation, especially for M/EEG"
readme = "README.rst"
license = "Apache-2.0"
authors = [{ name = "Jordan O'Byrne", email = "jordan.obyrne@gmail.com" }]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.22",
    "scipy>=1.7",
    "matplotlib>=3.5",
    "powerlaw>=2.0",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]

[project.optional-dependencies]
test = ["pytest>=7", "pytest-cov"]
docs = [
    "sphinx>=7",
    "pydata-sphinx-theme>=0.15",
    "numpydoc>=1.6",
    "myst-parser>=2",
]

[project.urls]
Repository = "https://github.com/jnobyrne/edgeofpy"
Issues = "https://github.com/jnobyrne/edgeofpy/issues"
Documentation = "https://edgeofpy.readthedocs.io"
Changelog = "https://github.com/jnobyrne/edgeofpy/blob/main/CHANGELOG.md"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: slow tests (skip with: pytest -m 'not slow')",
]

[tool.ruff.lint]
# pyflakes (undefined names, unused imports/variables) and syntax errors
select = ["E4", "E7", "E9", "F"]
